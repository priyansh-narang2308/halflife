# Halflife on Bifrost: the gateway (with its dashboard), Redis for the semantic
# cache, and, in the demo profile, mock providers that make no external call.
#
#   docker compose --profile demo up --build                                 mocks, no keys
#   HALFLIFE_ENV_FILE=.env HALFLIFE_CONFIG=./deploy/live/config.json docker compose up --build      real providers
#   ./deploy/share.sh                                                        the demo, on a public link
#
# The virtual keys and setup token in deploy/ are synthetic and public. Replace
# them before exposing the gateway; share.sh replaces the token. Keys from .env
# reach the gateway only when HALFLIFE_ENV_FILE asks for them: the setup token
# can reconfigure providers, so the demo must never hold real keys.
name: halflife

services:
  gateway:
    build:
      context: ./bifrost
      dockerfile: transports/Dockerfile.local
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080" # loopback until the deploy/ keys are replaced
    env_file:
      - path: ${HALFLIFE_ENV_FILE:-/dev/null}
        required: false
    volumes:
      - ${HALFLIFE_CONFIG:-./deploy/demo/config.json}:/app/data/config.json:ro
      - gateway-data:/app/data
      - ./deploy/demo/catalog:/app/catalog:ro # the demo's model catalog, so startup needs no download
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:8.2.2 # search and vectorset modules, needed by the semantic cache
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 2s
      timeout: 2s
      retries: 15

  mockllm:
    profiles: [demo]
    build: ./testenv
    command: ["mockllm", "-addr", "0.0.0.0:9101", "-fixtures", "/fixtures/llm.json"]
    environment:
      MOCK_LLM_API_KEY: sk-halflife-mock # synthetic

  mocktavily:
    profiles: [demo]
    build: ./testenv
    command: ["mocktavily", "-addr", "0.0.0.0:9102", "-fixtures", "/fixtures/tavily.json"]
    environment:
      MOCK_TAVILY_API_KEY: tvly-mock # synthetic

volumes:
  gateway-data:
